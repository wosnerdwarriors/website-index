<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Compare hardcoded march times from the castle red zone for four march-speed presets.">
  <title>Castle March Speeds - WOS Nerds</title>
  <link rel="stylesheet" href="/dist/css/tailwind.css?v=2">
  <link rel="stylesheet" href="/css/darkmode.css">
  <link rel="stylesheet" href="/castle-march%20speeds/css/style.css">
</head>
<body class="bg-gray-50">
  <div class="md:ml-64 p-4 transition-all duration-300 min-h-screen flex flex-col">
    <main class="flex-grow castle-march-page">
      <section class="march-tool" aria-labelledby="page-title">
        <div class="scenario-controls" role="group" aria-label="March speed scenario">
          <button type="button" class="scenario-button" data-scenario="speed10" aria-pressed="false">10% · No Pets</button>
          <button type="button" class="scenario-button is-active" data-scenario="speed25" aria-pressed="true">25% · No Pets</button>
          <button type="button" class="scenario-button" data-scenario="speed40" aria-pressed="false">40% · Pets active</button>
          <button type="button" class="scenario-button" data-scenario="speed55" aria-pressed="false">55% · Pets active</button>
        </div>

        <div class="selection-panel" aria-live="polite">
          <span class="selection-kicker">Selected city</span>
          <strong id="selected-coordinate">None</strong>
          <span id="selected-time">Select any city to view its march time.</span>
        </div>

        <h1 id="page-title">March Speed 25% - No Pets</h1>

        <div class="map-viewport" aria-label="Castle red-zone march time map">
          <div class="isometric-stage">
            <div id="city-grid" class="city-grid" role="grid" aria-label="Cities from coordinates 586 through 612 around the castle"></div>
            <div id="axis-layer" class="axis-layer" aria-hidden="true"></div>
          </div>
        </div>

        <div class="legend" aria-label="March-time color legend">
          <span class="legend-item"><span class="legend-swatch fastest"></span><span id="fastest-label">fastest · 36s</span></span>
          <span class="legend-item"><span class="legend-swatch slowest"></span><span id="slowest-label">slowest · 85s</span></span>
        </div>
      </section>
    </main>

    <footer class="mt-auto py-4 text-center text-gray-600 border-t">
      <p>All data is free to copy and use. See <a href="https://github.com/wosnerdwarriors" target="_blank" rel="noopener noreferrer" class="text-blue-600 hover:underline">WOS Nerds on GitHub</a> for source code.</p>
    </footer>
  </div>

  <script src="/js/navbar.js"></script>
  <script src="/js/google-analytics.js"></script>
  <script src="/js/darkmode.js"></script>
  <script src="/castle-march%20speeds/js/script.js"></script>
</body>
</html>
